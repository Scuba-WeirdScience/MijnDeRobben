name: Auto release notes

# Runs after every push to main (i.e. after a PR merges).
# Looks at the merged PR for a release label and an optional
# "## Release notes" section, then bumps ngsw-config.json and
# prepends an entry to release-notes.json.
#
# Because main is branch-protected, the bot opens a small PR
# (chore/release-X.Y.Z) and immediately enables auto-merge so it
# lands as soon as the two required checks pass (~1 min).
#
# PR labels that control the version bump:
#   release:patch  →  2.6.0 → 2.6.1   (default when no label present)
#   release:minor  →  2.6.0 → 2.7.0
#   release:major  →  2.6.0 → 3.0.0
#
# Commits that already contain "[skip release]" (the release PR title)
# are ignored to avoid infinite loops.

on:
  push:
    branches: [main]

jobs:
  release-notes:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Find merged PR and determine bump
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            const merged = prs.find(p => p.merged_at && p.base.ref === 'main');
            if (!merged) {
              console.log('No merged PR found for this commit — skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('pr_title', merged.title);
            core.setOutput('pr_number', String(merged.number));

            // Determine bump from labels
            const labels = merged.labels.map(l => l.name);
            let bump = 'patch';
            if (labels.includes('release:major')) bump = 'major';
            else if (labels.includes('release:minor')) bump = 'minor';
            core.setOutput('bump', bump);

            // Extract "## Release notes" section from PR body
            const body = merged.body ?? '';
            const match = body.match(/##\s+Release notes\s*\n([\s\S]*?)(?=\n##|$)/i);
            let items = [];
            if (match) {
              items = match[1]
                .split('\n')
                .map(l => l.replace(/^[-*]\s*/, '').trim())
                .filter(Boolean);
            }
            if (items.length === 0) {
              // Fall back to PR title, stripping conventional commit prefix
              items = [merged.title.replace(/^(feat|fix|refactor|chore|docs|style|test|perf|ci|build|revert)(\([^)]*\))?[!]?:\s*/i, '')];
            }
            core.setOutput('items', JSON.stringify(items));

      - name: Bump version and update release notes files
        id: bump
        if: steps.pr.outputs.skip == 'false'
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const bump     = process.env.BUMP;
          const itemsRaw = process.env.ITEMS;
          const items    = JSON.parse(itemsRaw);
          const today    = new Date().toISOString().slice(0, 10);

          // ── 1. Bump ngsw-config.json ────────────────────────────────────
          const ngswPath = 'frontend/ngsw-config.json';
          const ngsw = JSON.parse(fs.readFileSync(ngswPath, 'utf8'));
          const [maj, min, pat] = ngsw.appData.version.split('.').map(Number);
          let newVersion;
          if      (bump === 'major') newVersion = `${maj + 1}.0.0`;
          else if (bump === 'minor') newVersion = `${maj}.${min + 1}.0`;
          else                       newVersion = `${maj}.${min}.${pat + 1}`;
          ngsw.appData.version = newVersion;
          fs.writeFileSync(ngswPath, JSON.stringify(ngsw, null, 2) + '\n');
          console.log(`Bumped version: ${maj}.${min}.${pat} → ${newVersion}`);

          // ── 2. Prepend entry to release-notes.json ──────────────────────
          const rnPath = 'frontend/src/assets/release-notes.json';
          const entries = JSON.parse(fs.readFileSync(rnPath, 'utf8'));
          entries.unshift({
            version: newVersion,
            date: today,
            sections: [{ heading: 'Nieuw', items }],
          });
          fs.writeFileSync(rnPath, JSON.stringify(entries, null, 2) + '\n');
          console.log(`Prepended release notes for ${newVersion}`);

          // ── 3. Write new version to output file for later steps ─────────
          fs.writeFileSync(process.env.GITHUB_OUTPUT, `new_version=${newVersion}\n`, { flag: 'a' });
          EOF
        env:
          BUMP:  ${{ steps.pr.outputs.bump }}
          ITEMS: ${{ steps.pr.outputs.items }}

      - name: Open release PR and enable auto-merge
        if: steps.pr.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        with:
          script: |
            const version   = process.env.NEW_VERSION;
            const branch    = `chore/release-${version}`;
            const { execSync } = require('child_process');

            // Configure git
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            // Create and push the release branch
            execSync(`git checkout -b ${branch}`);
            execSync('git add frontend/ngsw-config.json frontend/src/assets/release-notes.json');

            // Check if there's anything to commit
            try {
              execSync('git diff --cached --quiet');
              console.log('Nothing to commit — skipping.');
              return;
            } catch (_) {
              // diff returns exit code 1 when there ARE changes — that's what we want
            }

            execSync(`git commit -m "chore: release ${version} [skip release]"`);
            execSync(`git push origin ${branch}`);

            // Open the PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `chore: release ${version} [skip release]`,
              head:  branch,
              base:  'main',
              body:  `Automatic version bump to \`${version}\` — triggered by merging PR #${{ steps.pr.outputs.pr_number }}.\n\n_This PR was created by the Auto release notes workflow and will auto-merge once checks pass._`,
            });

            console.log(`Opened PR #${pr.number}: ${pr.html_url}`);

            // Enable auto-merge (squash)
            await github.rest.pulls.updateBranch;
            await github.graphql(`
              mutation ($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) { pullRequest { number } }
              }
            `, { pullRequestId: pr.node_id });

            console.log(`Auto-merge enabled on PR #${pr.number}`);
