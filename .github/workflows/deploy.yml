name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          npx ng build

      - name: Build functions
        working-directory: functions
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Authenticate to Google Cloud (production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (production)
        run: npx -y firebase-tools@latest deploy --only hosting,functions,firestore:indexes --force
        env:
          FIREBASE_DEPLOY_AGENT: github-actions-${{ github.run_id }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read top entry from release-notes.json
          VERSION=$(node -e "const r=require('./frontend/public/assets/release-notes.json'); console.log(r[0].version)")
          TAG="v${VERSION}"

          # Skip if tag already exists
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping release."
            exit 0
          fi

          # Build release body from sections + items
          BODY=$(node -e "
            const r=require('./frontend/public/assets/release-notes.json')[0];
            const lines=[];
            for (const s of r.sections) {
              lines.push('### ' + s.heading);
              for (const i of s.items) lines.push('- ' + i);
              lines.push('');
            }
            process.stdout.write(lines.join('\n'));
          ")

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "${BODY}" \
            --target main
