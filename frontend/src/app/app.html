<app-navbar />

<!-- Install prompt banner — appears just below navbar when installable -->
<app-install-prompt-banner />

<main
  class="bg-white dark:bg-gray-900"
  [ngClass]="isFullscreen()
    ? 'flex-1 min-h-0 overflow-hidden flex flex-col'
    : 'flex-1 min-h-0 overflow-y-auto'">
  <router-outlet />
</main>

<app-toast />

@if (isNavigating()) {
  <app-spinner [fullPage]="true" />
}

<!-- Update notification — fixed bottom banner when new SW version is ready -->
<app-update-notification />

<!-- Release notes dialog — shown once after a version update with notes -->
@if (pwa.showReleaseNotes()) {
  <app-release-notes-dialog />
}
