<div hlmEmpty class="py-12">
  @if (icon() !== 'none') {
    <svg
      class="mx-auto h-12 w-12 text-gray-300 dark:text-gray-600 mb-4"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        [attr.d]="iconPath()"
      />
    </svg>
  }
  <p hlmEmptyDescription>{{ message() }}</p>
  <div hlmEmptyContent class="mt-4">
    <ng-content />
  </div>
</div>
