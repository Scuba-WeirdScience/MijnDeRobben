<!-- Backdrop -->
<div class="fixed inset-0 z-40 bg-black/50" (click)="pwa.dismissReleaseNotes()"></div>

<!-- Dialog -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white dark:bg-gray-800 shadow-2xl flex flex-col max-h-[80vh]">

    <!-- Header -->
    <div class="px-6 pt-6 pb-4 border-b border-gray-100 dark:border-gray-700">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs font-medium text-scuba-600 uppercase tracking-wide mb-1">
            Versie {{ pwa.releaseNotes()?.version }}
          </p>
          <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
            Wat is er nieuw?
          </h2>
        </div>
      </div>
    </div>

    <!-- Body — scrollable -->
    <div class="overflow-y-auto px-6 py-4 space-y-4 flex-1 min-h-0">
      @for (section of pwa.releaseNotes()?.sections; track section.heading) {
        <div>
          <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-2">
            {{ section.heading }}
          </h3>
          <ul class="space-y-1">
            @for (item of section.items; track item) {
              <li class="flex gap-2 text-sm text-gray-700 dark:text-gray-300">
                <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-scuba-500"></span>
                <span>{{ item }}</span>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-700 flex justify-end">
      <app-button variant="primary" (click)="pwa.dismissReleaseNotes()">
        Begrepen
      </app-button>
    </div>

  </div>
</div>
