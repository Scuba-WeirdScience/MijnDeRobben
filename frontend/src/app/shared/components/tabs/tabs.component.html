<!-- Tab navigatiebalk -->
<div class="border-b border-gray-200 dark:border-gray-700">
  <nav class="-mb-px flex" aria-label="Tabs">
    @for (tab of tabs(); track tab.id()) {
      <button
        (click)="activate(tab.id())"
        [attr.aria-selected]="activeTabId() === tab.id()"
        class="px-5 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap"
        [class.border-scuba-600]="activeTabId() === tab.id()"
        [class.text-scuba-600]="activeTabId() === tab.id()"
        [class.dark:text-scuba-400]="activeTabId() === tab.id()"
        [class.dark:border-scuba-400]="activeTabId() === tab.id()"
        [class.border-transparent]="activeTabId() !== tab.id()"
        [class.text-gray-500]="activeTabId() !== tab.id()"
        [class.dark:text-gray-400]="activeTabId() !== tab.id()"
        [class.hover:text-scuba-600]="activeTabId() !== tab.id()"
        [class.dark:hover:text-scuba-400]="activeTabId() !== tab.id()"
        [class.hover:border-scuba-300]="activeTabId() !== tab.id()">
        {{ tab.label() }}
      </button>
    }
  </nav>
</div>

<!-- Tab inhoud — alle tabs gerenderd, inactieve verborgen via [hidden] -->
<!-- [hidden] ipv @if om DOM-state (formulierwaarden, scroll) te bewaren -->
<div class="pt-4">
  @for (tab of tabs(); track tab.id()) {
    <div [hidden]="activeTabId() !== tab.id()">
      <!-- Tab content wordt geprojecteerd via TabComponent's ng-content -->
    </div>
  }
  <ng-content />
</div>
