<span [class]="cls()">
  @if (pulse()) {
    <span class="relative flex h-2 w-2">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
            [class]="pulseCls()"></span>
      <span class="relative inline-flex h-2 w-2 rounded-full"
            [class]="pulseCls()"></span>
    </span>
  }
  <ng-content />
</span>
