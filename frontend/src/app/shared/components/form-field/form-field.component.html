<div hlmField>
  @if (label()) {
    <span hlmFieldLabel>
      {{ label() }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </span>
  }

  <div hlmFieldContent>
    <ng-content />

    @if (hint()) {
      <span hlmFieldDescription>{{ hint() }}</span>
    }

    @if (error()) {
      <hlm-field-error>{{ error() }}</hlm-field-error>
    }
  </div>
</div>
