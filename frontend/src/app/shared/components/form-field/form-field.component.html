<div class="space-y-1.5">
  <div [class]="labelCls()">
    {{ label() }}
    @if (required()) {
      <span class="text-red-500 ml-0.5">*</span>
    }
  </div>

  <ng-content />

  @if (hint()) {
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{{ hint() }}</p>
  }

  @if (error()) {
    <p class="text-xs text-red-600 dark:text-red-400 flex items-center gap-1 mt-0.5">
      <svg lucideTriangleAlert class="w-3.5 h-3.5 shrink-0"></svg>
      {{ error() }}
    </p>
  }
</div>
