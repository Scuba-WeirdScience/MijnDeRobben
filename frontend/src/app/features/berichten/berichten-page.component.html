<div class="flex flex-1 min-h-0 overflow-hidden bg-gray-50 dark:bg-gray-950">

  <!-- ── GROEPEN sidebar ─────────────────────────────────────── -->
  <aside
    class="w-56 flex-shrink-0 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex flex-col"
    [style.display]="mobilePanel() === 'groepen' ? 'flex' : isMobile() ? 'none' : 'flex'">
    <app-groep-list
      (groepSelected)="onGroepSelected()"
      (openBeheer)="showBeheer.set(true)"
      (selectConcepten)="onShowConcepten()">
    </app-groep-list>
  </aside>

  <!-- ── THREADS / CONCEPTEN panel ──────────────────────────────────────── -->
  <div
    class="w-72 flex-shrink-0 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex flex-col"
    [style.display]="mobilePanel() === 'threads' ? 'flex' : isMobile() ? 'none' : 'flex'">

    <!-- Mobile back button -->
    <div class="md:hidden flex items-center px-3 py-2 border-b border-gray-200 dark:border-gray-700">
      <button (click)="mobilePanel.set('groepen')" class="flex items-center gap-1 text-sm text-scuba-600 dark:text-scuba-400">
        <svg lucideChevronLeft class="w-4 h-4"></svg>
        Groepen
      </button>
    </div>

    @if (showConcepten()) {
      <app-concepten-panel
        (conceptSelected)="onConceptSelected($event)"
        class="flex-1 overflow-hidden flex flex-col">
      </app-concepten-panel>
    } @else if (service.activeGroepId()) {
      <app-thread-list
        (newThread)="onNewThread()"
        (threadSelected)="onThreadSelected()"
        class="flex-1 overflow-hidden flex flex-col">
      </app-thread-list>
    } @else {
      <div class="flex-1 flex items-center justify-center p-6 text-center">
        <p class="text-sm text-gray-400 dark:text-gray-500">Selecteer een groep.</p>
      </div>
    }
  </div>

  <!-- ── MESSAGES panel ────────────────────────────────────── -->
  <main
    class="flex-1 flex flex-col overflow-hidden"
    [style.display]="mobilePanel() === 'messages' ? 'flex' : isMobile() ? 'none' : 'flex'">

    <!-- Mobile back button -->
    <div class="md:hidden flex items-center px-3 py-2 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex-shrink-0">
      <button (click)="mobilePanel.set('threads')" class="flex items-center gap-1 text-sm text-scuba-600 dark:text-scuba-400">
        <svg lucideChevronLeft class="w-4 h-4"></svg>
        Threads
      </button>
    </div>

    <app-message-list class="flex-1 overflow-hidden flex flex-col min-h-0"></app-message-list>

    <!-- ── Drag handle ──────────────────────────────────────── -->
    @if (service.activeThreadId()) {
    <div
      class="flex-shrink-0 h-1.5 cursor-row-resize bg-gray-200 dark:bg-gray-700 hover:bg-scuba-400 dark:hover:bg-scuba-500 transition-colors flex items-center justify-center group"
      (mousedown)="onDragStart($event)"
      (touchstart)="onDragStart($event)">
      <div class="w-8 h-0.5 rounded-full bg-gray-400 dark:bg-gray-500 group-hover:bg-scuba-500 dark:group-hover:bg-scuba-400 transition-colors"></div>
    </div>
    }

    <app-message-compose
      [style.height.px]="composeHeight()"
      class="flex-shrink-0 overflow-hidden flex flex-col">
    </app-message-compose>
  </main>

</div>

<!-- ── Side panel: Groep beheer ───────────────────────────── -->
@if (showBeheer()) {
  <app-side-panel title="Groepen beheren" size="lg" (closed)="showBeheer.set(false)">
    <app-groep-beheer></app-groep-beheer>
  </app-side-panel>
}

<!-- ── Side panel: Nieuwe thread / Thread concept bewerken ─── -->
@if (showNewThread()) {
  <app-side-panel
    [title]="editingThreadConcept() ? 'Thread concept bewerken' : 'Nieuwe thread'"
    size="md"
    (closed)="showNewThread.set(false); editingThreadConcept.set(null)">
    <app-thread-compose
      [initialConcept]="editingThreadConcept()"
      (created)="onThreadCreated($event)"
      (cancelled)="showNewThread.set(false); editingThreadConcept.set(null)">
    </app-thread-compose>
  </app-side-panel>
}
