<div class="flex flex-col gap-4">

  <div>
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
      Titel <span class="text-red-500">*</span>
    </label>
    <app-input
      [(value)]="title"
      placeholder="Geef de thread een titel…"
      [disabled]="isBusy">
    </app-input>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
      Eerste bericht <span class="text-gray-400 font-normal">(optioneel)</span>
    </label>
    <app-textarea
      [(value)]="body"
      placeholder="Schrijf een eerste bericht…"
      [rows]="4"
      [disabled]="isBusy">
    </app-textarea>
  </div>

  <div class="flex gap-3 justify-end">
    <app-button variant="secondary" (click)="cancelled.emit()" [disabled]="isBusy">Annuleer</app-button>
    <app-button
      variant="secondary"
      (click)="saveAsConcept()"
      [disabled]="!canSubmit || isBusy"
      [loading]="savingConcept()">
      Opslaan als concept
    </app-button>
    <app-button
      variant="primary"
      (click)="submit()"
      [disabled]="!canSubmit || isBusy"
      [loading]="saving()">
      Aanmaken
    </app-button>
  </div>

  <!-- Thread concept list -->
  @if (service.threadConcepten().length > 0) {
    <div class="border-t border-gray-100 dark:border-gray-800 pt-3">
      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Concepten:</p>
      @for (concept of service.threadConcepten(); track concept.id) {
        <div class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-300 py-1">
          <svg lucideFileText class="w-3 h-3 text-gray-400 flex-shrink-0"></svg>
          <span class="truncate flex-1 font-medium">{{ concept.title }}</span>
          <button
            (click)="loadConcept(concept)"
            class="text-scuba-600 dark:text-scuba-400 hover:underline flex-shrink-0">
            Bewerken
          </button>
          <button
            (click)="publishConcept(concept.id)"
            class="text-scuba-600 dark:text-scuba-400 hover:underline flex-shrink-0">
            Publiceer
          </button>
          <button
            (click)="deleteConcept(concept.id)"
            class="text-red-500 hover:underline flex-shrink-0">
            Verwijder
          </button>
        </div>
      }
    </div>
  }

</div>
