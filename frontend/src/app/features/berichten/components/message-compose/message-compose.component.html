@if (service.activeThreadId()) {
  <div class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex flex-col flex-1 min-h-0 overflow-hidden">

    <div class="flex items-end gap-2 px-3 py-2 flex-1 min-h-0 overflow-hidden">

      <!-- Quill editor with emoji suggestion dropdown -->
      <div class="flex-1 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 min-w-0 min-h-0 overflow-hidden relative flex flex-col">
        <div #editorMount class="editor-mount flex-1 min-h-0 overflow-hidden"></div>

        <!-- Emoji shortcode suggestion list -->
        @if (emojiSuggestions().length > 0) {
          <div class="emoji-suggestions">
            @for (suggestion of emojiSuggestions(); track suggestion.id; let i = $index) {
              <button
                type="button"
                (mousedown)="$event.preventDefault(); confirmEmojiSuggestion(i)"
                [class.bg-gray-100]="i === emojiSelectedIndex()"
                [class.dark:bg-gray-700]="i === emojiSelectedIndex()"
                class="emoji-suggestion-item">
                <span class="text-lg leading-none">{{ suggestion.native }}</span>
                <span class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ suggestion.name }}</span>
              </button>
            }
          </div>
        }
      </div>

      <!-- Action buttons column -->
      <div class="flex flex-col gap-1 flex-shrink-0 items-center">

        <!-- Save as concept checkbox -->
        <label class="flex items-center justify-center w-8 h-8 cursor-pointer" title="Opslaan als concept">
          <input
            type="checkbox"
            [checked]="saveAsDraft()"
            (change)="saveAsDraft.set($any($event.target).checked)"
            [disabled]="sending() || savingConcept()"
            class="rounded border-gray-300 dark:border-gray-600 text-scuba-600 focus:ring-scuba-500">
        </label>

        <!-- Send -->
        <button
          (click)="send()"
          [disabled]="!body().trim() || sending() || savingConcept()"
          [title]="saveAsDraft() ? 'Opslaan als concept' : 'Verstuur'"
          class="w-8 h-8 flex items-center justify-center rounded-lg bg-scuba-600 hover:bg-scuba-700 text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
          <svg lucideSend class="w-4 h-4"></svg>
        </button>
      </div>
    </div>

    <!-- Concepts -->
    @if (service.conceptMessages().length > 0) {
      <div #conceptList class="flex-shrink-0 px-3 pb-2 border-t border-gray-100 dark:border-gray-800 pt-2">
        <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Concepten:</p>
        @for (concept of service.conceptMessages(); track concept.id) {
          <div class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-300 py-1"
               [class.bg-amber-50]="currentConceptId() === concept.id"
               [class.dark:bg-amber-900\/10]="currentConceptId() === concept.id"
               [class.-mx-3]="currentConceptId() === concept.id"
               [class.px-3]="currentConceptId() === concept.id"
               [class.rounded]="currentConceptId() === concept.id">
            <svg lucideFileText class="w-3 h-3 text-gray-400 flex-shrink-0"></svg>
            <span class="truncate flex-1" [innerHTML]="concept.body | slice:0:60"></span>
            <button (click)="loadConcept(concept)" class="text-scuba-600 dark:text-scuba-400 hover:underline flex-shrink-0">Bewerken</button>
            <button (click)="publishConcept(concept.id)" class="text-scuba-600 dark:text-scuba-400 hover:underline flex-shrink-0">Publiceer</button>
            <button (click)="deleteConcept(concept.id)" class="text-red-500 hover:underline flex-shrink-0">Verwijder</button>
          </div>
        }
      </div>
    }

  </div>
}
