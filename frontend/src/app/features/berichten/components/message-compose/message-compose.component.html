@if (service.activeThreadId()) {
  <div class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 flex-shrink-0">

    <div class="flex items-end gap-2 px-3 py-2">

      <!-- Quill editor: toolbar on top, input below, all inside rounded border -->
      <div class="flex-1 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 min-w-0">
        <div #editorMount></div>
      </div>

      <!-- Action buttons column -->
      <div class="flex flex-col gap-1 flex-shrink-0">

        <!-- Emoji -->
        <div class="relative">
          <button
            (click)="toggleEmojiPicker(); $event.stopPropagation()"
            title="Emoji"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-scuba-600 dark:hover:text-scuba-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
            <svg lucideSmile class="w-4 h-4"></svg>
          </button>
          @if (showEmojiPicker()) {
            <div class="emoji-picker-container" (click)="$event.stopPropagation()">
              <em-emoji-picker (emoji-select)="onEmojiSelect($event)" locale="nl" theme="auto"></em-emoji-picker>
            </div>
          }
        </div>

        <!-- Save as concept -->
        <button
          (click)="saveAsConcept()"
          [disabled]="!body().trim() || savingConcept() || sending()"
          title="Opslaan als concept"
          class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-scuba-600 dark:hover:text-scuba-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
          <svg lucideFileText class="w-4 h-4"></svg>
        </button>

        <!-- Send -->
        <button
          (click)="send()"
          [disabled]="!body().trim() || sending() || savingConcept()"
          title="Verstuur"
          class="w-8 h-8 flex items-center justify-center rounded-lg bg-scuba-600 hover:bg-scuba-700 text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
          <svg lucideSend class="w-4 h-4"></svg>
        </button>
      </div>
    </div>

    <!-- Concepts -->
    @if (service.conceptMessages().length > 0) {
      <div class="px-3 pb-2 border-t border-gray-100 dark:border-gray-800 pt-2">
        <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Concepten:</p>
        @for (concept of service.conceptMessages(); track concept.id) {
          <div class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-300 py-1">
            <svg lucideFileText class="w-3 h-3 text-gray-400 flex-shrink-0"></svg>
            <span class="truncate flex-1" [innerHTML]="concept.body | slice:0:60"></span>
            <button (click)="service.publishMessageConcept(concept.id)" class="text-scuba-600 dark:text-scuba-400 hover:underline flex-shrink-0">Publiceer</button>
            <button (click)="service.deleteMessageConcept(concept.id)" class="text-red-500 hover:underline flex-shrink-0">Verwijder</button>
          </div>
        }
      </div>
    }

  </div>
}
