@if (isAuthor()) {
  <div class="mt-1.5">

    <!-- Clickable counter badge -->
    <button
      type="button"
      (click)="toggle()"
      class="flex items-center gap-1.5 text-xs text-gray-400 dark:text-gray-500 hover:text-scuba-600 dark:hover:text-scuba-400 transition-colors">
      <!-- Double-checkmark SVG -->
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5"
        viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12l5 5L17 4"/>
        <path d="M8 12l5 5L23 4" opacity="0.5"/>
      </svg>
      <span>
        {{ thread().threadSeenCount }}/{{ totalCount() || thread().threadSeenCount }} gelezen
      </span>
      <!-- Expand/collapse chevron -->
      <svg class="w-3 h-3 transition-transform" [ngClass]="isExpanded() ? 'rotate-180' : ''"
        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <!-- Expandable member list -->
    @if (isExpanded()) {
      <div class="mt-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm overflow-hidden text-xs w-56">
        @if (loading()) {
          <div class="flex items-center justify-center py-3 gap-2 text-gray-400">
            <app-spinner size="sm" />
            <span>Laden…</span>
          </div>
        } @else if (lezingen().length === 0) {
          <p class="px-3 py-2 text-gray-400 dark:text-gray-500">Nog niemand heeft dit gelezen.</p>
        } @else {
          <ul>
            @for (lezing of lezingen(); track lezing.uid) {
              <li class="flex items-center gap-2 px-3 py-1.5 border-b border-gray-100 dark:border-gray-800 last:border-0">
                @if (lezing.gezien) {
                  <!-- Green checkmark -->
                  <svg class="w-3.5 h-3.5 flex-shrink-0 text-green-500 dark:text-green-400"
                    fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 13l4 4L19 7"/>
                  </svg>
                } @else {
                  <!-- Grey dash -->
                  <svg class="w-3.5 h-3.5 flex-shrink-0 text-gray-300 dark:text-gray-600"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                  </svg>
                }
                <span [ngClass]="lezing.gezien
                  ? 'text-gray-800 dark:text-gray-200'
                  : 'text-gray-400 dark:text-gray-500'">
                  {{ lezing.displayName }}
                </span>
              </li>
            }
          </ul>
        }
      </div>
    }

  </div>
}
