<app-side-panel
  [title]="editingMateriaal() ? 'Materiaal bewerken' : 'Materiaal toevoegen'"
  [subtitle]="$safeNavigationMigration(editingMateriaal()?.naam)"
  (closed)="cancelled.emit()"
>
  <div class="space-y-5">
    <app-form-field
      label="Naam *"
      hint="Bijv. Duikfles #1, Trimvest Medium, …"
      [error]="firstError(materiaalFormState.naam())"
    >
      <app-input
        [value]="materiaalNaam()"
        (valueChange)="setMateriaalNaam($event)"
        [maxLength]="100"
        placeholder="Naam"
      />
    </app-form-field>

    <app-form-field label="Serienummer" hint="Optioneel">
      <app-input [(value)]="materiaalSerienummer" [maxLength]="100" placeholder="Serienummer" />
    </app-form-field>

    <!-- Custom property fields -->
    @for (field of customPropertyDefs(); track field.key) {
    <app-form-field [label]="field.label">
      <app-input
        [value]="materiaalFormCustomProperties()[field.key] ?? ''"
        (input)="setCustomProp(field.key, $any($event.target).value)"
        [maxLength]="100"
        [placeholder]="field.label"
      />
    </app-form-field>
    }

    <app-form-field label="Aankoopdatum" hint="Optioneel">
      <app-input [(value)]="materiaalAankoopDatum" type="date" placeholder="YYYY-MM-DD" />
    </app-form-field>

    <app-form-field label="Notities" hint="Optioneel">
      <app-textarea
        [(value)]="materiaalNotities"
        [rows]="3"
        [maxLength]="500"
        placeholder="Optionele notities…"
      />
    </app-form-field>

    <div class="flex justify-end gap-3 pt-2 border-t border-gray-100 dark:border-gray-700">
      <app-button variant="secondary" (click)="cancelled.emit()">Annuleren</app-button>
      <app-button variant="primary" [loading]="saving()" (click)="onSave()">Opslaan</app-button>
    </div>

    <!-- Leninggeschiedenis (alleen bij bewerken) -->
    @if (editingMateriaal()) {
    <app-materiaal-lening-history [materiaalId]="editingMateriaal()!.id" />
    }
  </div>
</app-side-panel>
