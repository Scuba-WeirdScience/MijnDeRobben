    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Brevettenbeheer</h1>

      <!-- Member picker -->
      <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm p-5">
        <h2 class="text-base font-semibold text-gray-700 dark:text-gray-300 mb-3">Selecteer een lid</h2>
        <div class="flex gap-3">
          <input
            type="search"
            [(ngModel)]="memberSearch"
            (ngModelChange)="onMemberSearch()"
            placeholder="Zoek op naam of e-mail…"
            class="flex-1 max-w-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-4 py-2 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-scuba-500"
          />
        </div>

        @if (membersLoading()) {
          <app-spinner size="sm" class="mt-3" />
        } @else if (members().length) {
          <ul class="mt-3 divide-y divide-gray-100 dark:divide-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden max-h-64 overflow-y-auto">
            @for (m of members(); track m.id) {
              <li>
                <button
                  (click)="selectMember(m)"
                  [class]="'w-full text-left px-4 py-3 text-sm transition-colors hover:bg-scuba-50 dark:hover:bg-scuba-900/20'
                    + (selectedMember()?.id === m.id ? ' bg-scuba-50 dark:bg-scuba-900/30' : '')"
                >
                  <span class="font-medium text-gray-900 dark:text-white">{{ m.firstName }} {{ m.lastName }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </div>

      <!-- Per-member brevet panel — opens as side panel -->
      @if (selectedMember()) {
        <div class="fixed inset-0 z-40 bg-black/20 backdrop-blur-sm" (click)="selectedMember.set(null)"></div>
        <div class="fixed inset-y-0 right-0 z-50 flex w-full max-w-2xl flex-col bg-white dark:bg-gray-900 shadow-2xl">

          <!-- Header -->
          <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex-shrink-0">
            <div>
              <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Brevetten</h2>
              <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400 truncate max-w-xs">
                {{ selectedMember()!.firstName }} {{ selectedMember()!.lastName }}
              </p>
            </div>
            <button
              (click)="selectedMember.set(null)"
              class="rounded-lg p-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              aria-label="Sluiten"
            >
              <svg lucideX class="h-5 w-5"></svg>
            </button>
          </div>

          <!-- Scrollable content -->
          <div class="flex-1 overflow-y-auto px-6 py-6">
            <app-member-brevet-panel
              [memberId]="selectedMember()!.id"
              [readonly]="brevettenReadonly()"
            />
          </div>
        </div>
      }

    </div>
